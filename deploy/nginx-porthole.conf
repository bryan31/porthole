# Porthole website on nginx: serves the static site in website/ and writes every request for
# a download to its own log, which scripts/download-stats.py turns into download counts.
#
# Set up (Debian/Ubuntu paths; other systems differ only in where the files go):
#   1. Upload the site:
#        rsync -a --delete --exclude .DS_Store website/ you@server:/var/www/porthole/
#   2. Copy this file to /etc/nginx/conf.d/porthole.conf and put your domain in server_name.
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. HTTPS: sudo certbot --nginx -d your.domain  (adds the certificate and the 443 server)
#   5. Counting: see the top of scripts/download-stats.py (copy it over, add one cron line).
#
# The download log keeps each visitor's IP address, which is what lets a visitor count once a
# day. It sits in /var/log/nginx/, so the system's nginx logrotate rule already rotates it
# (on Debian/Ubuntu: daily, 14 days kept). download-stats.py --db keeps only daily totals,
# with no addresses, so the counts outlive the rotated logs.
#
# If a CDN or another proxy is ever put in front of this server, $remote_addr becomes the
# proxy's address and every visitor looks the same: add set_real_ip_from/real_ip_header
# (ngx_http_realip_module) for that proxy, or the counts will be far too low.

log_format porthole_download escape=json
  '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"range":"$http_range",'
  '"done":"$request_completion","ua":"$http_user_agent","referer":"$http_referer"}';

server {
    listen 80;
    listen [::]:80;
    server_name porthole.example.com;    # your domain

    root /var/www/porthole;
    index index.html;
    charset utf-8;

    # Text is sent compressed; the images and the zip are compressed already.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain;

    # Hidden files such as .DS_Store, anywhere; certbot's .well-known stays reachable.
    # (Regex locations are tried in order, so this one comes first.)
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Pages, styles and scripts keep their names from one release to the next, so browsers
    # check back with every visit (a cheap 304 when nothing changed).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Images change only when the screenshots are rendered again.
    location ~* \.(?:webp|png|svg|ico)$ {
        add_header Cache-Control "max-age=86400";
    }

    # Downloads. No caching in between, so every download reaches this server and is counted
    # (and a zip rebuilt under the same version is never served stale).
    location /downloads/ {
        types {
            application/zip zip;
            text/plain      sha256;
        }
        add_header Cache-Control "no-cache";
        access_log /var/log/nginx/access.log;
        access_log /var/log/nginx/porthole-downloads.log porthole_download;
    }
}
